[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "screenjarvis"
version = "0.1.0"
description = "Push-to-talk dictation that can see your screen: voice + cursor + screenshots compiled into annotated markdown."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "httpx>=0.27",
    "sounddevice>=0.4.6",
    "mss>=9.0",
    "pynput>=1.7.6",
]

[project.scripts]
sj = "screenjarvis.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/screenjarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
